# ============================================================
# KONFIGURACJA GAZETY „GRZYB TIMES”
# Ten plik edytujesz TY. Routine czyta go przy każdym wydaniu.
# Zmiana = commit do repo, nic więcej.
# ============================================================

wydanie:
  tytul: "Grzyb Times"
  jezyk: pl
  akapity: 5          # CEL i górna granica akapitów na artykuł; gdy materiału
                      # źródłowego jest za mało — daj mniej, nie dopychaj wodą

# ------------------------------------------------------------
# POGODA — pasek w nagłówku. Rutyna przy generowaniu parsuje
# aktualną pogodę ze strony Interii (prognoza_url; zero tokenów),
# a kliknięcie w temperaturę otwiera tę stronę. Gdy parsowanie
# zawiedzie, przeglądarka czytelnika użyje Open-Meteo (lat/lon).
# ------------------------------------------------------------
pogoda:
  miasto: "Nowy Dwór Mazowiecki"
  lat: 52.4306
  lon: 20.7158
  prognoza_url: "https://pogoda.interia.pl/prognoza-szczegolowa-nowy-dwor-mazowiecki,cId,23541"

# ------------------------------------------------------------
# TEMATY / KATEGORIE — kolejność ma znaczenie (pierwsza = okładka).
# `liczba` = ile artykułów w danej kategorii (od najważniejszego).
# Łączna liczba artykułów wydania = suma wszystkich `liczba`.
# Pierwsza kategoria „Okładka" (liczba: 1) = wielki artykuł otwierający
# wydanie, wybierany jako NAJWAŻNIEJSZA wiadomość dnia z dowolnego tematu.
# `okno_min_h` (opcjonalne) = minimalne okno świeżości dla kategorii w godzinach.
# Domyślnie okno liczy się od poprzedniego wydania (~12–26 h), co pasuje do newsów
# rynkowych i politycznych, ale nie do nauki: recenzowane badanie z przedwczoraj
# jest tak samo świeże jak wczorajsze, a serwisy naukowe publikują nierówno
# (audyt 30.07.2026: „Nauka” złożona 1/2, bo kandydat z Nature Astronomy z 28.07
# wypadł poza okno 26 h). Tam, gdzie temat nie starzeje się przez dobę, dajemy
# szersze okno — deduplikacja względem naszych wcześniejszych wydań i tak obowiązuje.
# ------------------------------------------------------------
kategorie:
  - nazwa: Okładka
    liczba: 1
    zakres: "NAJWAŻNIEJSZA informacja dnia — dowolny temat (rynki, polityka, wojna, technologia, nauka); ta, która trafia na okładkę. Nie powielaj tej wiadomości w innych kategoriach."
    wykres: opcjonalny
  - nazwa: Inwestowanie
    liczba: 3
    zakres: "rynki, akcje, M&A, decyzje banków centralnych"
    wykres: preferowany
  - nazwa: Polityka
    liczba: 3
    zakres: "KONKRETNE decyzje z realnym skutkiem dla obywateli/gospodarki: uchwalone
      ustawy i regulacje, budżet, podatki, polityka zagraniczna, umowy i sankcje.
      NIE PISZ o: nominacjach i tym kto objął/został wybrany na jakie stanowisko;
      sondażach; partyjnych sporach, kłótniach i przepychankach. Liczy się MERYTORYKA
      i skutek, nie personalia i polityczne gierki."
    wykres: opcjonalny
  - nazwa: Wojna
    liczba: 3 
    zakres: "konflikty zbrojne, geopolityka, bezpieczeństwo"
    wykres: opcjonalny
  - nazwa: Technologia
    liczba: 2
    zakres: "NOWINKI techniczne i realny POSTĘP: nowe urządzenia i premiery,
      przełomy inżynieryjne i materiałowe, półprzewodniki, przemysł kosmiczny,
      cyberbezpieczeństwo, telekomunikacja, oprogramowanie.
      NIE PISZ o: AI, chipach AI i centrach danych (od tego jest osobna kategoria
      AI); programowaniu, językach, frameworkach i narzędziach deweloperskich
      (kategoria Software Development AI); pozwach, procesach, ugodach i sporach
      prawnych firm; sprawach antymonopolowych. Liczy się technika i postęp, nie
      sądy i korporacyjne przepychanki."
    wykres: opcjonalny
  - nazwa: AI
    liczba: 2
    zakres: "sztuczna inteligencja: nowe modele i możliwości, laboratoria AI
      (OpenAI, Anthropic, Google DeepMind, xAI, Meta), wdrożenia i produkty AI,
      regulacje AI, chipy i infrastruktura pod AI, humanoidy i robotyka.
      NIE PISZ o: narzędziach AI dla programistów i funkcjach asystentów kodowania
      (Claude Code, GitHub Copilot, agenty w IDE) — od tego jest kategoria
      Software Development AI. Premiera modelu należy tutaj, ale „co nowego umie
      w kodzie” — tam."
    wykres: opcjonalny
  - nazwa: Software Development AI
    liczba: 2
    zakres: "wytwarzanie oprogramowania okiem praktyka. Cztery obszary, trzymaj je
      w rotacji między wydaniami zamiast wracać codziennie do tego samego:
      (1) NARZĘDZIA AI DLA PROGRAMISTÓW — nowe funkcje Claude/Claude Code i GitHub
      Copilota, agenty w IDE, MCP, code review wspierane modelem;
      (2) JAK SIĘ DZIŚ WYTWARZA OPROGRAMOWANIE — praktyki i metodyki, dane o
      produktywności zespołów, wnioski z wdrożeń AI w firmach, bezpieczeństwo
      łańcucha zależności;
      (3) JAVA I SPRING — wydania JDK i Spring Boot/Framework, JEP-y, zmiany
      w ekosystemie i bibliotekach, migracje wersji;
      (4) ARCHITEKTURA — wzorce i antywzorce, kompromisy projektowe, skalowanie,
      rozbijanie monolitów, kolejki i spójność danych.
      Konkret dla praktyka: co dokładnie się zmieniło, w jakiej wersji i co z tego
      wynika przy klawiaturze. Wpis z bloga bez nowości (kolejny tutorial „jak
      zrobić X”) to NIE news.
      NIE PISZ o: modelach i laboratoriach AI w ogólności (kategoria AI), sprzęcie
      i elektronice użytkowej (Technologia), kursach spółek technologicznych
      (Inwestowanie)."
    wykres: opcjonalny
    okno_min_h: 72
  - nazwa: Nauka
    liczba: 2
    zakres: "twarde doniesienia naukowe: opublikowane badania i odkrycia (medycyna,
      fizyka, biologia, chemia, klimat, astronomia), przełomy badawcze. Konkrety:
      co odkryto, w jakim badaniu / czasopiśmie, co z tego wynika. NIE technologia
      konsumencka i NIE AI (osobne kategorie)."
    wykres: opcjonalny
    okno_min_h: 72
  - nazwa: Ciekawostka na dziś
    liczba: 2
    zakres: "lekka ciekawostka na koniec — natura, niezwykłe zjawiska, miejsca i rekordy.
      NIE historia (od tego jest kategoria Tego dnia) i NIE poważne doniesienia badawcze
      (od nich jest kategoria Nauka) i NIE technologia."
    wykres: nie
    okno_min_h: 72
  # `Tego dnia` — jedyna kategoria bez okna świeżości: to nie news, tylko rocznica.
  # Artykuły pomijają `zrodlo.opublikowano` (dozwolone — skrypt wtedy nie liczy wieku).
  # Źródło: dzienna strona Wikipedii (pl.wikipedia.org/wiki/D_miesiąc dla wątku polskiego,
  # en.wikipedia.org/wiki/Month_D dla światowego) — szczegóły w instrukcja.md KROK 1.
  - nazwa: Tego dnia
    liczba: 2
    zakres: "wydarzenie historyczne, które miało miejsce dokładnie w tym dniu kalendarzowym
      (rocznica — dzień i miesiąc muszą się zgadzać, rok dowolny z przeszłości). Kolejność
      wyboru: (1) NAJPIERW przełomowe wydarzenie ŚWIATOWE — zmieniło bieg historii,
      rozpoznawalne globalnie (wojny, odkrycia, przełomy naukowe/technologiczne, upadki
      i powstania państw); (2) jeśli takiego nie ma, wydarzenie z POLSKI ma pierwszeństwo
      przed innymi krajami; (3) dopiero gdy i w historii Polski tego dnia nie ma nic
      istotnego, sięgnij po wydarzenie z innego kraju. Weryfikuj datę w źródle — NIE
      pisz z pamięci. NIE: gołe rocznice urodzin/śmierci bez samego wydarzenia, fakty
      niepewne co do daty, wydarzenie już opisane w tej kategorii w poprzednich wydaniach."
    wykres: nie

# ------------------------------------------------------------
# ŹRÓDŁA PIERWOTNE — zamknięta lista. Każdy artykuł MUSI
# pochodzić z jednej z tych domen (link artykułu).
# ------------------------------------------------------------
# UWAGA: reuters.com USUNIĘTY — blokuje bota Claude-User w robots.txt (błąd 400
# „domain not accessible”), więc jest bezużyteczny. Jeśli w Logs zobaczysz ten sam
# błąd dla innej domeny — też ją stąd wyrzuć.
zrodla_pierwotne:
  - bloomberg.com
  - pap.pl
  - bankier.pl
  - money.pl
  - zero.pl/kategoria/swiat
  - aljazeera.com
  # Bliski Wschód / Iran — przeciwwaga dla narracji zachodniej:
  - amwaj.media        # specjalista Iran/Zatoka, źródła wewnątrz irańskiej polityki
  - middleeasteye.net  # reportaże z terenu, krytyczny wobec Izraela/Zachodu
  # Technologia:
  - theregister.com    # enterprise IT, sprzęt, security; jawnie zezwala botom Claude
  - spidersweb.pl      # polski serwis tech
  # AI:
  - the-decoder.com    # serwis wyłącznie o AI: modele, laboratoria, wdrożenia
  # Software Development AI (dodane 30.07.2026 wraz z kategorią; robots.txt
  # każdej domeny sprawdzony — żadna nie blokuje bota):
  - infoq.com          # główny koń roboczy kategorii: kilka newsów dziennie,
                       # osobne działy Java, architektura i praktyki zespołowe
  - github.blog        # changelog GitHuba i Copilota — codziennie, konkretne wersje
  - anthropic.com      # oficjalne wydania i funkcje Claude (news + engineering)
  - devblogs.microsoft.com  # Visual Studio, Copilot SDK, .NET — codzienny wolumen
  - spring.io          # oficjalny blog Springa: wydania + „This Week in Spring”
  - inside.java        # OpenJDK/JDK z pierwszej ręki: JEP-y, rampdown, wydania
  - martinfowler.com   # architektura i praktyki inżynierskie, kilka wpisów w tygodniu
  # ODRZUCONE przy doborze źródeł do tej kategorii:
  # thenewstack.io — robots.txt blokuje ClaudeBot, Claude-Web i anthropic-ai;
  # baeldung.com   — zwraca 403 przy pobraniu treści (bot odbija się od WAF-a).
  # Nauka + Ciekawostka na dziś:
  - sciencedaily.com
  - phys.org
  - sciencenews.org    # dziennikarstwo naukowe (Society for Science), bez paywalla
  - livescience.com    # codzienny popularnonaukowy; lżejsze tematy też pod Ciekawostkę
  # Dołożone po audycie 30.07.2026 („Nauka” 1/2 — za mało kandydatów w oknie):
  - eurekalert.org     # komunikaty prasowe wprost od czasopism i uczelni (AAAS);
                       # największy dzienny wolumen twardych doniesień, zawsze z nazwą
                       # czasopisma i datą — pierwszy przystanek dla kategorii Nauka
  - naukawpolsce.pl    # serwis naukowy PAP — polskie badania i polski punkt widzenia
  - sciencealert.com   # duży dzienny wolumen, dobrze zbudowane omówienia badań;
                       # lżejsze tematy nadają się też pod Ciekawostkę
  # ODRZUCONE przy tym samym audycie: medicalxpress.com — robots.txt jawnie zamyka
  # /news/ dla ClaudeBot/GPTBot (medycynę bierzemy z eurekalert.org i sciencedaily.com).
  # Uzupełnienie braków (audyt logów 19.07.2026):
  - finance.yahoo.com  # globalne rynki, działa też w weekendy (Inwestowanie);
                       # zastąpił marketwatch.com, który blokuje bota (błąd 400, audyt 20.07.2026)
  - interia.pl         # polskie newsy z konkretnymi URL-ami (Polityka)
  - newatlas.com       # nowinki techniczne i przełomy inżynieryjne (Technologia)
  - space.com          # przemysł kosmiczny — luka wykryta przy pominiętym Starship Flight 13
  # Tego dnia (dodane 03.08.2026 wraz z kategorią; robots.txt sprawdzony, bota nie blokuje):
  - pl.wikipedia.org    # dzienna strona „D miesiąc” — wątek polski i weryfikacja daty
  - en.wikipedia.org    # dzienna strona „Month D” — wątek światowy, szerszy zestaw wydarzeń
  # ---- WOJNA i geopolityka (dodane 04.08.2026 — audyt monokultury źródeł) ----
  # Powód: Al Jazeera dawała 77% artykułów w kategorii Wojna (40 z 52) i 75% okładek.
  # Nie była to wina doboru, tylko luka w tej liście: po usunięciu reuters.com kategoria
  # miała trzy źródła, z czego amwaj.media i middleeasteye.net dały po JEDNYM artykule
  # w całym archiwum. Jedno źródło musiało udźwignąć 3 artykuły dziennie.
  # Każda domena niżej: robots.txt przepuszcza Claude-User ORAZ realnie pobrano artykuł
  # (samo robots.txt nie wystarcza — baeldung.com przechodził robots i dawał 403).
  # Ukraina i Rosja:
  - kyivindependent.com  # anglojęzyczny, publikuje 24/7; ~990 artykułów w sitemapie
  - ukrinform.net        # ukraińska agencja państwowa — komunikaty z pierwszej ręki
  # Obronność i wojskowość (sprzęt, decyzje zbrojeniowe, przemysł):
  - defensenews.com
  - militarytimes.com
  - breakingdefense.com
  # Analiza kampanii — think tanki. UWAGA: to KOMENTARZ i ocena, nie doniesienie o faktach.
  # Nadają się na kontekst i tło, nie jako jedyne źródło newsa dnia:
  - understandingwar.org # ISW — codzienne oceny kampanii (Ukraina, Bliski Wschód)
  - warontherocks.com
  - csis.org
  - atlanticcouncil.org
  # Polski trop — gazetę czyta Polak, a kategoria nie miała ANI JEDNEGO polskiego źródła:
  - defence24.pl         # polski portal obronny: wojsko, przemysł zbrojeniowy, NATO
  - konflikty.pl         # polski serwis o konfliktach i wojskowości
  - notesfrompoland.com  # polskie sprawy po angielsku — dobre na wątek Polski w świecie
  # Generaliści światowi (Wojna, Okładka, Polityka) — rozbijają monokulturę okładki:
  - euronews.com
  - npr.org
  # USUNIĘTE 18.08.2026: bbc.com i dw.com. Powód nie jest domysłem — WebSearch zwracał
  # dla nich twarde „400 domain not accessible” w logach wydań 16.08 i 18.08, czyli
  # dokładnie ten sam objaw, przez który wypadły reuters.com i marketwatch.com. Przez
  # trzy tygodnie stały na liście jako martwe pozycje, więc pula generalistów dla
  # Okładki była realnie o połowę mniejsza, niż wyglądała.
  # Polski trop na Okładkę bierz z pap.pl, interia.pl i notesfrompoland.com (wyżej na
  # liście) — po wpadce 16–18.08.2026 (wypadek autokaru z polskimi pielgrzymami na
  # Węgrzech, przespany o dwa dni) to nie jest opcja, tylko obowiązkowy przystanek.
  # ODRZUCONE przy tym audycie (twarde dowody, nie domysły):
  # theguardian.com, france24.com, haaretz.com — robots.txt jawnie blokuje Claude-User
  #   (france24.com dodatkowo zwraca 403);
  # newarab.com, arabnews.com — HTTP 403 przy pobraniu (WAF odbija bota);
  # polskieradio.pl — robots.txt niedostępny, więc brak zgody na piśmie.
  # Uwaga o botach: liczy się WYŁĄCZNIE Claude-User (tym pobiera WebFetch). Blokada
  # ClaudeBota (crawler treningowy) NIE dyskwalifikuje źródła — aljazeera.com
  # i theregister.com blokują ClaudeBota, a dostarczyły 77 i 16 artykułów.

# ------------------------------------------------------------
# RESEARCH WTÓRNY — tryb WYJĄTKOWY, nie rutynowy. Poza listę
# źródeł wolno wyjść TYLKO gdy:
#  (a) w materiale brakuje naprawdę istotnej informacji, bez
#      której artykuł byłby niepełny lub mylący, albo
#  (b) informacje źródła wydają się nierzetelne/sprzeczne
#      i wymagają weryfikacji.
# NIE dla ozdobnego kontekstu, danych do wykresu ani wydłużania
# akapitów. Stały wyjątek: bieżący kurs walut do przeliczeń PLN.
# Źródło wtórne NIGDY nie jest linkiem artykułu (zrodlo.url), ale
# jeśli jego treść trafiła do akapitów — musi być wypisane
# w `zrodla_dodatkowe` przy artykule.
# ------------------------------------------------------------
research_wtorny:
  tryb: wyjatkowo   # nigdy | wyjatkowo | swobodnie

# ------------------------------------------------------------
# LITERATURA — stała rubryka wydania (cytat / przysłowie / wiersz
# dnia z omówieniem + angielskie słówko i zwrot). Rubryka jest
# ODERWANA od newsów: omówienie mówi o samym tekście, nie o wydarzeniach
# dnia — to ma być świeże spojrzenie, nie kolejny komentarz do wydania.
# Szczegóły składu: routine/instrukcja.md (KROK 2.7).
# `zrodlo_wierszy` — biblioteka poezji w domenie publicznej (bot ma
# dostęp; sprawdzone 22.07.2026). Cytat/przysłowie/angielski model
# składa z własnej wiedzy (atrybucję cytatu może zweryfikować w sieci).
# `bez_powtorek_wydan` — ile ostatnich wydań stanowi listę zakazaną:
# rutyna startuje bez pamięci, więc bez tej listy wraca do tych samych
# wierszy i przysłów (audyt 30.07.2026: Kochanowski 5 wierszy z 6,
# „Na zdrowie” i „Kuj żelazo…” po dwa razy w trzy dni).
# ------------------------------------------------------------
literatura:
  wlaczona: true
  zrodlo_wierszy: wolnelektury.pl   # API: /api/genres/wiersz/books/?format=json
  bez_powtorek_wydan: 30
